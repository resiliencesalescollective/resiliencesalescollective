<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Resilience Sales Collective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.v2.css?v=71" />
  <style>
    .thankyou-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1E1A17;
      text-align: center;
      padding: 4rem 2rem;
    }
    .thankyou-inner {
      max-width: 600px;
    }
    .thankyou-inner .label {
      margin-bottom: 1.6rem;
    }
    .thankyou-inner h1 {
      font-size: clamp(3rem, 6vw, 6rem);
      margin-bottom: 2rem;
    }
    .thankyou-inner .body-text {
      max-width: 100%;
      text-align: center;
      margin: 0 auto 1.6rem;
    }
    .thankyou-inner .btn-primary {
      margin-top: 2.5rem;
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="logo">Resilience Sales Collective</div>
    <a href="index.html#apply" class="nav-cta">Apply Now</a>
  </nav>

  <div class="thankyou-section">
    <div class="thankyou-inner">
      <p class="label">Application Received</p>
      <h1>Thank You!</h1>
      <p class="body-text">Your submission was successful. Someone from our team will be reaching out to you within the next 24 hours.</p>
      <p class="body-text">We're excited to learn more about you and your business!</p>
      <a href="index.html" class="btn-primary">Back to Home</a>
    </div>
  </div>

</body>
</html>

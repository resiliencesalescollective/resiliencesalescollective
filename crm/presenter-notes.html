<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presenter Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Archivo, sans-serif;
      background: #14100E;
      color: #F3EDE3;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid #2C2620;
    }
    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #A08256;
    }
    .counter {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #A79C90;
    }
    main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 32px 34px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .slide-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #A08256;
      margin-bottom: 10px;
    }
    .note-text {
      font-size: 22px;
      line-height: 1.55;
      color: #F3EDE3;
      white-space: pre-line;
    }
    .cue {
      margin-top: 16px;
      font-size: 16px;
      line-height: 1.55;
      color: #A79C90;
      font-style: italic;
    }
    .next-block {
      flex: none;
      border-top: 1px solid #2C2620;
      padding: 22px 34px 26px;
    }
    .next-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6E655C;
      margin-bottom: 8px;
    }
    .next-text {
      font-size: 15px;
      line-height: 1.5;
      color: #A79C90;
    }
    .waiting {
      margin: auto;
      text-align: center;
      color: #6E655C;
      font-size: 14px;
      line-height: 1.7;
      max-width: 340px;
    }
    .waiting b { color: #A79C90; }
    .nav-row {
      flex: none;
      display: flex;
      gap: 10px;
      padding: 16px 22px;
      border-top: 1px solid #2C2620;
    }
    .nav-btn {
      flex: 1;
      font: 700 12px Archivo, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #F3EDE3;
      background: #1B1714;
      border: 1px solid #3A342F;
      border-radius: 8px;
      padding: 12px 0;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .nav-btn:hover { border-color: #A08256; background: #241E19; }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <span class="brand">RSC · Presenter Notes</span>
    <span class="counter" id="counter">—</span>
  </header>

  <main id="main">
    <div class="waiting" id="waiting">
      Waiting for the presentation to start…<br><br>
      Go back to the deck tab, click <b>Present</b>, and this window will follow along automatically.
    </div>
  </main>

  <div class="next-block" id="nextBlock" style="display:none;">
    <div class="next-label">Up next</div>
    <div class="next-text" id="nextText">—</div>
  </div>

  <div class="nav-row" id="navRow" style="display:none;">
    <button class="nav-btn" id="prevBtn">← Back</button>
    <button class="nav-btn" id="nextBtn">Next →</button>
  </div>

  <div id="debugBar" style="font:11px monospace;color:#6E655C;padding:8px 22px;border-top:1px solid #2C2620;white-space:pre-line;"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const deckId = params.get('id');
    let channel = null;
    try { channel = new BroadcastChannel('pitch-presenter-' + deckId); } catch (err) { /* unavailable — other channels still work */ }

    const debugLines = [];
    function log(line) {
      debugLines.push(new Date().toLocaleTimeString() + '  ' + line);
      while (debugLines.length > 6) debugLines.shift();
      const bar = document.getElementById('debugBar');
      if (bar) bar.textContent = debugLines.join('\n');
    }
    log('deckId=' + deckId + ' opener=' + (!!window.opener) + ' channel=' + (!!channel));

    let current = null;

    // Called directly by the main window if it can reach us that way.
    function receiveUpdate(msg) { log('received via direct call, index=' + msg.index); render(msg); }

    function render(msg) {
      current = msg;
      const waitingEl = document.getElementById('waiting');
      if (waitingEl) waitingEl.style.display = 'none';
      document.getElementById('nextBlock').style.display = 'block';
      document.getElementById('navRow').style.display = 'flex';
      document.getElementById('counter').textContent = (msg.index + 1) + ' / ' + msg.total;

      const main = document.getElementById('main');
      main.innerHTML = `
        <div>
          <div class="slide-label">${escapeHtml(msg.slideLabel || '')}</div>
          <div class="note-text">${escapeHtml(msg.note || '')}</div>
          ${msg.cue ? `<div class="cue">${escapeHtml(msg.cue)}</div>` : ''}
        </div>`;

      document.getElementById('nextText').textContent = msg.nextLabel
        ? msg.nextLabel + (msg.nextNote ? ' — ' + msg.nextNote : '')
        : 'This is the last slide.';

      document.getElementById('prevBtn').disabled = msg.index <= 0;
      document.getElementById('nextBtn').disabled = msg.index >= msg.total - 1;
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Send on every channel we have — as long as one gets through in this
    // browser's privacy configuration, the main window stays in sync.
    function send(msg) {
      const results = [];
      if (channel) { try { channel.postMessage(msg); results.push('bc:ok'); } catch (err) { results.push('bc:FAIL ' + err.message); } }
      else results.push('bc:none');
      if (window.opener && !window.opener.closed) {
        try { window.opener.postMessage(msg, window.location.origin); results.push('pm:ok'); } catch (err) { results.push('pm:FAIL ' + err.message); }
        try { if (typeof window.opener.presenterNavigate === 'function' && msg.type === 'nav') { window.opener.presenterNavigate(msg.dir); results.push('direct:ok'); } else results.push('direct:n/a'); } catch (err) { results.push('direct:FAIL ' + err.message); }
      } else {
        results.push('opener:MISSING');
      }
      log('sent ' + msg.type + (msg.dir ? ':' + msg.dir : '') + '  [' + results.join(', ') + ']');
    }

    function goTo(dir) {
      if (!current) return;
      send({ type: 'nav', dir });
    }

    document.getElementById('prevBtn').addEventListener('click', () => goTo('prev'));
    document.getElementById('nextBtn').addEventListener('click', () => goTo('next'));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); goTo('next'); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo('prev'); }
    });

    window.addEventListener('message', (e) => {
      if (e.origin !== window.location.origin || !e.data) return;
      if (e.data.type === 'update') { log('received via postMessage, index=' + e.data.index); render(e.data); }
    });

    if (channel) {
      channel.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'update') { log('received via BroadcastChannel, index=' + e.data.index); render(e.data); }
      });
    }

    // Ask the presenting window to resend its current slide, in case it was
    // already presenting before this notes window opened.
    send({ type: 'ready' });
  </script>
</body>
</html>

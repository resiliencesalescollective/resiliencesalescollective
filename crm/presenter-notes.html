<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presenter Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Archivo, sans-serif;
      background: #14100E;
      color: #F3EDE3;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid #2C2620;
    }
    .brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #A08256;
    }
    .counter {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #A79C90;
    }
    main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 32px 34px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .slide-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #A08256;
      margin-bottom: 10px;
    }
    .note-text {
      font-size: 22px;
      line-height: 1.55;
      color: #F3EDE3;
      white-space: pre-line;
    }
    .cue {
      margin-top: 16px;
      font-size: 16px;
      line-height: 1.55;
      color: #A79C90;
      font-style: italic;
    }
    .next-block {
      flex: none;
      border-top: 1px solid #2C2620;
      padding: 22px 34px 26px;
    }
    .next-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6E655C;
      margin-bottom: 8px;
    }
    .next-text {
      font-size: 15px;
      line-height: 1.5;
      color: #A79C90;
    }
    .waiting {
      margin: auto;
      text-align: center;
      color: #6E655C;
      font-size: 14px;
      line-height: 1.7;
      max-width: 340px;
    }
    .waiting b { color: #A79C90; }
    .edit-btn {
      font: 600 10.5px Archivo, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6E655C;
      background: none;
      border: 1px solid #2C2620;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      margin-top: 18px;
      transition: color 0.15s, border-color 0.15s;
    }
    .edit-btn:hover { color: #F3EDE3; border-color: #6E655C; }
    .edit-area {
      width: 100%;
      font: 400 17px Archivo, sans-serif;
      line-height: 1.5;
      color: #F3EDE3;
      background: #1B1714;
      border: 1px solid #3A342F;
      border-radius: 8px;
      padding: 12px 14px;
      resize: vertical;
      outline: none;
    }
    .edit-area:focus { border-color: #A08256; }
    .edit-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6E655C;
      margin-bottom: 6px;
    }
    .nav-row {
      flex: none;
      display: flex;
      gap: 10px;
      padding: 16px 22px;
      border-top: 1px solid #2C2620;
    }
    .nav-btn {
      flex: 1;
      font: 700 12px Archivo, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #F3EDE3;
      background: #1B1714;
      border: 1px solid #3A342F;
      border-radius: 8px;
      padding: 12px 0;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .nav-btn:hover { border-color: #A08256; background: #241E19; }
    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <span class="brand">RSC · Presenter Notes</span>
    <span class="counter" id="counter">—</span>
  </header>

  <main id="main">
    <div class="waiting" id="waiting">
      Waiting for the presentation to start…<br><br>
      Go back to the deck tab, click <b>Present</b>, and this window will follow along automatically.
    </div>
  </main>

  <div class="nav-row" id="navRow" style="display:none;">
    <button class="nav-btn" id="prevBtn">← Back</button>
    <button class="nav-btn" id="nextBtn">Next →</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const deckId = params.get('id');
    let channel = null;
    try { channel = new BroadcastChannel('pitch-presenter-' + deckId); } catch (err) { /* unavailable — other channels still work */ }

    let current = null;
    let editing = false;

    // Called directly by the main window if it can reach us that way.
    function receiveUpdate(msg) { render(msg); }

    function render(msg, force) {
      const changedSlide = !current || current.slideLabel !== msg.slideLabel;
      const wasEditingSameSlide = editing && !changedSlide && !force;
      current = msg;
      if (changedSlide) editing = false; // don't carry edit mode across slides

      const waitingEl = document.getElementById('waiting');
      if (waitingEl) waitingEl.style.display = 'none';
      document.getElementById('navRow').style.display = 'flex';
      document.getElementById('counter').textContent = (msg.index + 1) + ' / ' + msg.total;
      document.getElementById('prevBtn').disabled = msg.index <= 0;
      document.getElementById('nextBtn').disabled = msg.index >= msg.total - 1;

      // Don't rebuild the textareas out from under an active edit — the
      // echo-back of our own save would otherwise reset the cursor mid-typing.
      if (wasEditingSameSlide) return;

      const main = document.getElementById('main');
      if (editing) {
        main.innerHTML = `
          <div>
            <div class="slide-label">${escapeHtml(msg.slideLabel || '')}</div>
            <div class="edit-label">Notes</div>
            <textarea class="edit-area" id="editNote" rows="8">${escapeHtml(msg.note || '')}</textarea>
            <div class="edit-label" style="margin-top:14px;">Coaching cue (italic line, optional)</div>
            <textarea class="edit-area" id="editCue" rows="2">${escapeHtml(msg.cue || '')}</textarea>
            <button class="edit-btn" id="doneEditBtn">Done editing</button>
          </div>`;
        document.getElementById('doneEditBtn').addEventListener('click', () => { editing = false; render(current, true); });
        document.getElementById('editNote').addEventListener('input', scheduleSaveOverride);
        document.getElementById('editCue').addEventListener('input', scheduleSaveOverride);
      } else {
        main.innerHTML = `
          <div>
            <div class="slide-label">${escapeHtml(msg.slideLabel || '')}</div>
            <div class="note-text">${escapeHtml(msg.note || '')}</div>
            ${msg.cue ? `<div class="cue">${escapeHtml(msg.cue)}</div>` : ''}
            <button class="edit-btn" id="editBtn">✎ Edit these notes</button>
          </div>`;
        document.getElementById('editBtn').addEventListener('click', () => { editing = true; render(current, true); });
      }
    }

    let saveOverrideTimer = null;
    function scheduleSaveOverride() {
      clearTimeout(saveOverrideTimer);
      saveOverrideTimer = setTimeout(() => {
        if (!current) return;
        const body = document.getElementById('editNote').value;
        const cue = document.getElementById('editCue').value;
        send({ type: 'saveOverride', slideLabel: current.slideLabel, body, cue, id: Date.now() + '-' + Math.random() });
      }, 500);
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Send on every channel we have — as long as one gets through in this
    // browser's privacy configuration, the main window stays in sync.
    function send(msg) {
      if (channel) { try { channel.postMessage(msg); } catch (err) {} }
      if (window.opener && !window.opener.closed) {
        try { window.opener.postMessage(msg, window.location.origin); } catch (err) {}
        try { if (typeof window.opener.handleNavMessage === 'function' && msg.type === 'nav') window.opener.handleNavMessage(msg); } catch (err) {}
        try { if (typeof window.opener.handleSaveOverrideMessage === 'function' && msg.type === 'saveOverride') window.opener.handleSaveOverrideMessage(msg); } catch (err) {}
      }
    }

    function goTo(dir) {
      if (!current) return;
      send({ type: 'nav', dir, id: Date.now() + '-' + Math.random() });
    }

    document.getElementById('prevBtn').addEventListener('click', () => goTo('prev'));
    document.getElementById('nextBtn').addEventListener('click', () => goTo('next'));

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); goTo('next'); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo('prev'); }
    });

    window.addEventListener('message', (e) => {
      if (e.origin !== window.location.origin || !e.data) return;
      if (e.data.type === 'update') render(e.data);
    });

    if (channel) {
      channel.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'update') render(e.data);
      });
    }

    // Ask the presenting window to resend its current slide, in case it was
    // already presenting before this notes window opened.
    send({ type: 'ready' });
  </script>
</body>
</html>

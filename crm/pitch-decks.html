<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSC — Pitch Deck Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pitch-builder.css" />
</head>
<body class="pd-page">

  <header class="pd-header">
    <a href="dashboard.html" class="pb-back-link">← Dashboard</a>
    <div style="display:flex;align-items:baseline;gap:10px;flex:1;">
      <span class="pb-brand-rsc">RSC</span>
      <span class="pb-brand-text">Pitch Deck Builder</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="pb-nav-user" id="navUser"></span>
      <button class="pb-nav-signout" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <main class="pd-main">
    <div class="pd-page-header">
      <h1 class="pd-page-title">Your Pitch Decks</h1>
      <button class="pb-btn-primary" onclick="createNew()" id="newBtn">+ New Pitch Deck</button>
    </div>

    <div id="pageLoading" class="pd-loading">Loading…</div>
    <div id="deckList" class="pd-grid" style="display:none;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    let currentUserId = null;

    async function init() {
      const auth = await requireAuth();
      if (!auth) return;

      if (auth.profile.role !== 'admin') {
        window.location.href = 'dashboard.html';
        return;
      }

      currentUserId = auth.user.id;
      document.getElementById('navUser').textContent = auth.profile.full_name;

      await loadDecks();
    }

    async function loadDecks() {
      document.getElementById('pageLoading').style.display = '';
      document.getElementById('deckList').style.display = 'none';

      const { data: decks, error } = await db
        .from('pitch_decks')
        .select('id, client_name, program_name, created_at')
        .order('created_at', { ascending: false });

      document.getElementById('pageLoading').style.display = 'none';
      document.getElementById('deckList').style.display = '';

      if (error || !decks || !decks.length) {
        document.getElementById('deckList').innerHTML = `
          <div class="pd-empty">
            No pitch decks yet.<br>
            <span style="color:#A79C90;">Click "New Pitch Deck" to get started.</span>
          </div>`;
        return;
      }

      document.getElementById('deckList').innerHTML = decks.map(d => `
        <div class="pd-card">
          <div class="pd-card-info">
            <div class="pd-card-name">${escHtml(d.client_name || d.program_name || 'Untitled Pitch')}</div>
            <div class="pd-card-date">${formatDate(d.created_at)}</div>
          </div>
          <div class="pd-card-actions">
            <button class="pd-btn-ghost" onclick="duplicateDeck('${d.id}')">Duplicate</button>
            <button class="pd-btn-danger" onclick="deleteDeck('${d.id}', this)">Delete</button>
            <a href="pitch-builder.html?id=${d.id}" class="pd-btn-open">Open →</a>
          </div>
        </div>`).join('');
    }

    async function createNew() {
      const btn = document.getElementById('newBtn');
      btn.textContent = 'Creating…';
      btn.disabled = true;

      const { data, error } = await db
        .from('pitch_decks')
        .insert([{ user_id: currentUserId, client_name: 'Untitled Pitch' }])
        .select()
        .single();

      if (error || !data) {
        btn.textContent = '+ New Pitch Deck';
        btn.disabled = false;
        alert('Could not create pitch deck. Please try again.');
        return;
      }

      window.location.href = `pitch-builder.html?id=${data.id}`;
    }

    async function duplicateDeck(id) {
      const { data: src, error: loadErr } = await db
        .from('pitch_decks')
        .select('*')
        .eq('id', id)
        .single();

      if (loadErr || !src) { alert('Could not duplicate. Please try again.'); return; }

      const copy = { ...src };
      delete copy.id;
      delete copy.created_at;
      delete copy.updated_at;
      copy.user_id = currentUserId;
      copy.client_name = (src.client_name || 'Untitled Pitch') + ' (Copy)';

      const { data: newDeck, error: insertErr } = await db
        .from('pitch_decks')
        .insert([copy])
        .select()
        .single();

      if (insertErr || !newDeck) { alert('Could not duplicate. Please try again.'); return; }

      window.location.href = `pitch-builder.html?id=${newDeck.id}`;
    }

    async function deleteDeck(id, btn) {
      if (!confirm('Delete this pitch deck? This cannot be undone.')) return;
      btn.textContent = 'Deleting…';
      btn.disabled = true;

      const { error } = await db.from('pitch_decks').delete().eq('id', id);

      if (error) {
        btn.textContent = 'Delete';
        btn.disabled = false;
        alert('Could not delete. Please try again.');
        return;
      }

      await loadDecks();
    }

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>

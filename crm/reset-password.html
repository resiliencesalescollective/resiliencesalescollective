<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSC CRM — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="crm.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo">Resilience Sales Collective</div>
        <p class="login-sub">Set New Password</p>
      </div>

      <div id="loadingMsg" style="text-align:center;color:var(--cream-55);font-size:0.75rem;letter-spacing:0.1em;">Verifying link…</div>

      <form id="resetForm" style="display:none;">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="Choose a strong password" required />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat your password" required />
        </div>
        <div id="resetError" class="error-msg" style="display:none;"></div>
        <button type="submit" class="btn-primary" style="width:100%;">Update Password</button>
      </form>

      <div id="successMsg" style="display:none;text-align:center;">
        <p class="success-msg" style="margin-bottom:1.5rem;">Password updated successfully!</p>
        <a href="login.html" class="btn-primary">Back to Sign In</a>
      </div>

      <div id="errorMsg" style="display:none;text-align:center;">
        <p class="error-msg" style="margin-bottom:1.5rem;">This reset link is invalid or has expired.</p>
        <a href="login.html" class="btn-secondary">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    async function init() {
      const { data: { session }, error } = await db.auth.getSession();

      document.getElementById('loadingMsg').style.display = 'none';

      if (error || !session) {
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }

      document.getElementById('resetForm').style.display = 'block';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn      = e.target.querySelector('button');
      const errEl    = document.getElementById('resetError');
      const newPass  = document.getElementById('newPassword').value;
      const confirm  = document.getElementById('confirmPassword').value;

      errEl.style.display = 'none';

      if (newPass !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      if (newPass.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Updating…'; btn.disabled = true;

      const { error } = await db.auth.updateUser({ password: newPass });

      if (error) {
        errEl.textContent = 'Failed to update password. Please try again.';
        errEl.style.display = 'block';
        btn.textContent = 'Update Password'; btn.disabled = false;
      } else {
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      }
    });

    init();
  </script>
</body>
</html>

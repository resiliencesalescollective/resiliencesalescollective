<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSC CRM — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="crm.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo">Resilience Sales Collective</div>
        <p class="login-sub">Team Portal</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <div id="loginError" class="error-msg" style="display:none;"></div>
        <button type="submit" class="btn-primary" style="width:100%;margin-top:0.25rem;">Sign In</button>
        <p style="text-align:center;margin-top:1.2rem;">
          <a href="#" onclick="toggleForgot(event)" style="font-size:0.65rem;letter-spacing:0.15em;color:var(--cream-55);text-transform:uppercase;">Forgot Password?</a>
        </p>
      </form>

      <div id="forgotSection" style="display:none;margin-top:1.5rem;border-top:1px solid var(--cream-20);padding-top:1.5rem;">
        <div class="form-group">
          <label for="resetEmail">Enter your email</label>
          <input type="email" id="resetEmail" placeholder="your@email.com" />
        </div>
        <div id="resetMsg" style="display:none;"></div>
        <button class="btn-primary" style="width:100%;" onclick="sendReset()">Send Reset Link</button>
        <p style="text-align:center;margin-top:1rem;">
          <a href="#" onclick="toggleForgot(event)" style="font-size:0.65rem;letter-spacing:0.15em;color:var(--cream-55);text-transform:uppercase;">Back to Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    db.auth.getUser().then(({ data: { user } }) => {
      if (user) window.location.href = 'dashboard.html';
    });

    function toggleForgot(e) {
      e.preventDefault();
      const forgot = document.getElementById('forgotSection');
      const login  = document.getElementById('loginForm');
      const isShowing = forgot.style.display !== 'none';
      forgot.style.display = isShowing ? 'none' : 'block';
      login.style.display  = isShowing ? 'block' : 'none';
      document.getElementById('resetMsg').style.display = 'none';
    }

    async function sendReset() {
      const email  = document.getElementById('resetEmail').value.trim();
      const msgEl  = document.getElementById('resetMsg');
      if (!email) { msgEl.className = 'error-msg'; msgEl.textContent = 'Please enter your email.'; msgEl.style.display = 'block'; return; }

      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://www.resiliencesalescollective.com/crm/reset-password.html'
      });

      if (error) {
        msgEl.className = 'error-msg';
        msgEl.textContent = 'Something went wrong. Please try again.';
      } else {
        msgEl.className = 'success-msg';
        msgEl.textContent = 'Reset link sent! Check your email.';
      }
      msgEl.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const err = document.getElementById('loginError');
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      err.style.display = 'none';

      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      if (error) {
        err.textContent = 'Invalid email or password. Please try again.';
        err.style.display = 'block';
        btn.textContent = 'Sign In';
        btn.disabled = false;
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
